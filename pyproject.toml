[project]
name = "nba-game-webscraper"
version = "0.0.1"
description = "Webscraping tool to grab NBA games from nba.com and format into a csv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "devtools>=0.12.2",
    "requests>=2.34.2",
    "gcsa>=2.7.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "devtools>=0.12.2",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
url = "https://captionpartnersllc.jfrog.io/artifactory/api/pypi/pypi-local/simple"
default = true
