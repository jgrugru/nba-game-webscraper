[project]
name = "nba-game-webscraper"
version = "0.0.1"
description = "Webscraping tool to grab NBA games from nba.com and format into a csv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.2",
    "pydantic>=2.8.2",
    "devtools>=0.12.2",
    "selenium>=4.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "devtools>=0.12.2",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]
